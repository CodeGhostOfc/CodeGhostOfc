  <text x="893" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Discord Bots</text>
  <text x="893" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">JavaScript • Node.js</text>

