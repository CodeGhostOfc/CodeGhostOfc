  <text x="288" y="180" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8b949e">Developer • Programmer • Builder</text>

  <text x="288" y="220" font-family="Courier New, monospace" font-size="18" fill="#58a6ff">$</text>
  <text x="310" y="220" font-family="Courier New, monospace" font-size="18" fill="#c9d1d9">coding_since = 2020;</text>
