<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">CodeGhostOfc Developer Banner</title>
  <desc id="desc">Dark developer banner with ghost icon, CodeGhostOfc title, developer tagline, and code terminal styling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>

  <circle cx="1080" cy="38" r="170" fill="#5865F2" opacity="0.08"/>
  <circle cx="1140" cy="210" r="130" fill="#8b5cf6" opacity="0.07"/>

  <rect x="42" y="42" width="1116" height="216" rx="22" fill="#0d1117" stroke="#222b36" stroke-width="2"/>

  <rect x="42" y="42" width="1116" height="38" rx="22" fill="#161b22"/>
  <circle cx="68" cy="61" r="6" fill="#ff5f56"/>
  <circle cx="88" cy="61" r="6" fill="#ffbd2e"/>
  <circle cx="108" cy="61" r="6" fill="#27c93f"/>

  <text x="138" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8b949e">codeghost@github: ~/profile</text>

  <g transform="translate(84 108)" filter="url(#shadow)">
    <path d="M78 0C38 0 8 28 8 67c0 31 18 55 45 66v27c0 5 4 9 9 9h8c5 0 9-4 9-9v-16h18v16c0 5 4 9 9 9h8c5 0 9-4 9-9v-27c27-11 45-35 45-66C168 28 138 0 98 0H78z" fill="#5865F2"/>
    <circle cx="58" cy="67" r="9" fill="#ffffff"/>
    <circle cx="118" cy="67" r="9" fill="#ffffff"/>
    <path d="M52 103c15 12 57 12 72 0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
